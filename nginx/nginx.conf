events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    gzip         on;
    gzip_types   text/plain text/css application/json application/javascript
                 text/xml application/xml text/javascript image/svg+xml;

    # ── Customer app — thean.yourdomain.com ───────────────────────────────────
    server {
        listen 80;
        server_name thean.yourdomain.com;
        root /var/www/frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Delivery portal — delivery.yourdomain.com ─────────────────────────────
    server {
        listen 80;
        server_name delivery.yourdomain.com;
        root /var/www/delivery-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Pharmacy portal — pharmacy.yourdomain.com ─────────────────────────────
    server {
        listen 80;
        server_name pharmacy.yourdomain.com;
        root /var/www/pharmacy-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Haircut vendor portal — haircut.yourdomain.com ────────────────────────
    server {
        listen 80;
        server_name haircut.yourdomain.com;
        root /var/www/haircut-vendor-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Super admin — admin.yourdomain.com ────────────────────────────────────
    server {
        listen 80;
        server_name admin.yourdomain.com;
        root /var/www/super-admin-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Backend API — api.yourdomain.com ──────────────────────────────────────
    server {
        listen 80;
        server_name api.yourdomain.com;
        client_max_body_size 20M;

        location / {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── HTTPS (enable after running certbot) ──────────────────────────────────
    # After SSL certs are obtained, uncomment the blocks below and remove the
    # HTTP server blocks above (or keep them only for redirect).
    #
    # For each app, the pattern is:
    #
    # server {
    #     listen 80;
    #     server_name thean.yourdomain.com;
    #     return 301 https://$host$request_uri;   # redirect HTTP → HTTPS
    # }
    #
    # server {
    #     listen 443 ssl;
    #     server_name thean.yourdomain.com;
    #     ssl_certificate     /etc/nginx/ssl/live/thean.yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/live/thean.yourdomain.com/privkey.pem;
    #     root /var/www/frontend;
    #     index index.html;
    #     location / { try_files $uri $uri/ /index.html; }
    # }
    #
    # Repeat the same pattern for all other subdomains.
    # SSL cert path for api: /etc/nginx/ssl/live/api.yourdomain.com/
}
