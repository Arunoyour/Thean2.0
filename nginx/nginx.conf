events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    gzip         on;
    gzip_types   text/plain text/css application/json application/javascript
                 text/xml application/xml text/javascript image/svg+xml;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── HTTP → HTTPS redirect for all subdomains ──────────────────────────────
    server {
        listen 80;
        server_name thean.68-233-107-177.nip.io
                    delivery.68-233-107-177.nip.io
                    pharmacy.68-233-107-177.nip.io
                    haircut.68-233-107-177.nip.io
                    admin.68-233-107-177.nip.io
                    api.68-233-107-177.nip.io;
        return 301 https://$host$request_uri;
    }

    # ── Customer app ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name thean.68-233-107-177.nip.io;
        ssl_certificate     /etc/letsencrypt/live/thean.68-233-107-177.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thean.68-233-107-177.nip.io/privkey.pem;
        root  /var/www/frontend;
        index index.html;
        client_max_body_size 20M;

        location /api/ {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /media/ {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Delivery portal ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name delivery.68-233-107-177.nip.io;
        ssl_certificate     /etc/letsencrypt/live/thean.68-233-107-177.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thean.68-233-107-177.nip.io/privkey.pem;
        root  /var/www/delivery-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Pharmacy portal ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name pharmacy.68-233-107-177.nip.io;
        ssl_certificate     /etc/letsencrypt/live/thean.68-233-107-177.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thean.68-233-107-177.nip.io/privkey.pem;
        root  /var/www/pharmacy-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Haircut vendor portal ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name haircut.68-233-107-177.nip.io;
        ssl_certificate     /etc/letsencrypt/live/thean.68-233-107-177.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thean.68-233-107-177.nip.io/privkey.pem;
        root  /var/www/haircut-vendor-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Super admin ───────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name admin.68-233-107-177.nip.io;
        ssl_certificate     /etc/letsencrypt/live/thean.68-233-107-177.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thean.68-233-107-177.nip.io/privkey.pem;
        root  /var/www/super-admin-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Backend API ───────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.68-233-107-177.nip.io;
        ssl_certificate     /etc/letsencrypt/live/thean.68-233-107-177.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thean.68-233-107-177.nip.io/privkey.pem;
        client_max_body_size 20M;

        location / {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
