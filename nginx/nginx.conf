events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    gzip         on;
    gzip_types   text/plain text/css application/json application/javascript
                 text/xml application/xml text/javascript image/svg+xml;

    # ── Customer app — port 80 ────────────────────────────────────────────────
    server {
        listen 80;
        root /var/www/frontend;
        index index.html;
        client_max_body_size 20M;

        location /api/ {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /media/ {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Delivery portal — port 3001 ───────────────────────────────────────────
    server {
        listen 3001;
        root /var/www/delivery-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Pharmacy portal — port 3002 ───────────────────────────────────────────
    server {
        listen 3002;
        root /var/www/pharmacy-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Haircut vendor portal — port 3003 ─────────────────────────────────────
    server {
        listen 3003;
        root /var/www/haircut-vendor-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Super admin — port 3004 ───────────────────────────────────────────────
    server {
        listen 3004;
        root /var/www/super-admin-frontend;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Domain-based config (use this when you have a domain) ─────────────────
    # Uncomment and replace yourdomain.com with your actual domain, then run
    # certbot for SSL. Until then, the port-based config above handles routing.
    #
    # server { listen 80; server_name thean.yourdomain.com; ... }
    # server { listen 80; server_name delivery.yourdomain.com; ... }
    # server { listen 80; server_name api.yourdomain.com; ... }
}
