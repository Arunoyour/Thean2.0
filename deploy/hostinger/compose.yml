name: thean

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.35
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - thean-internal

  backend:
    image: thean-backend:hostinger
    build:
      context: ../../backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - backend-storage:/app/storage
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: 0.40
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - thean-internal

  nginx:
    image: thean-web:hostinger
    build:
      context: ../..
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    ports:
      - "8082:80"
      - "8084:3001"
      - "8085:3002"
      - "8086:3003"
      - "8087:3004"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    mem_limit: 192m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - thean-internal

networks:
  thean-internal:
    driver: bridge

volumes:
  postgres-data:
  backend-storage:
